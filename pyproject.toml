[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "codepact"
version = "0.3.0"
description = "Lightweight Python contract annotations for CodePact"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["codepact-cli==0.3.0"]
license = "MIT"
authors = [{ name = "CodePact contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[dependency-groups]
dev = [
  "basedpyright==1.40.1",
  "build==1.2.2.post1",
  "maturin==1.9.6",
  "hatchling==1.27.0",
  "mypy==1.19.1",
  "packaging==26.3",
  "pyright==1.1.411",
  "ruff==0.17.3",
  "twine==6.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["python/codepact"]

[tool.hatch.build.targets.sdist]
include = ["/python/codepact", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.uv.workspace]
members = ["cli"]

[tool.uv.sources]
codepact-cli = { workspace = true }

[tool.basedpyright]
include = ["python/codepact", "scripts"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
deprecateTypingAliases = true
enableTypeIgnoreComments = false
failOnWarnings = true
reportDeprecated = "error"
reportAny = "error"
reportExplicitAny = "error"
reportUnknownArgumentType = "error"
reportUnknownMemberType = "error"
reportUnknownParameterType = "error"
reportUnknownVariableType = "error"
reportIgnoreCommentWithoutRule = true
reportUnnecessaryTypeIgnoreComment = "error"

[tool.ruff]
target-version = "py311"
src = ["python"]

[tool.ruff.lint]
select = ["E", "F", "ANN", "PYI"]

[tool.ruff.format]
quote-style = "double"
