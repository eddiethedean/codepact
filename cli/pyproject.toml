[build-system]
requires = ["maturin==1.9.6"]
build-backend = "maturin"

[project]
name = "codepact-cli"
version = "0.4.0"
description = "Rust-powered CodePact contract inspector"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "CodePact contributors" }]

[tool.maturin]
manifest-path = "../crates/codepact/Cargo.toml"
bindings = "bin"
