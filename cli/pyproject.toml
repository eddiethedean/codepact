[build-system]
requires = ["maturin==1.9.6"]
build-backend = "maturin"

[project]
name = "typepact-cli"
version = "0.2.0"
description = "Rust-powered TypePact contract inspector"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "TypePact contributors" }]

[tool.maturin]
manifest-path = "../crates/typepact/Cargo.toml"
bindings = "bin"
