[advisories]
unmaintained = "all"
unsound = "all"
yanked = "deny"

[bans]
multiple-versions = "deny"
wildcards = "deny"
skip = [
  { crate = "syn@2.0.119", reason = "The locked transitive proc-macro graph requires both syn 2 and syn 3, whose major-version requirements cannot be unified." },
]

[licenses]
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSL-1.0",
  "BSD-2-Clause",
  "MIT",
  "Unlicense",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
