[package]
name = "codepact"
version = "0.5.0"
description = "Inspect CodePact contracts in Python source without executing it"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
readme = "../../README.md"
repository = "https://github.com/eddiethedean/codepact"
keywords = ["python", "static-analysis", "typing"]
categories = ["development-tools"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
ruff_python_parser = "=0.0.12"
ruff_python_ast = "=0.0.12"
ruff_text_size = "=0.0.12"
salsa = "=0.28.5"
toml = "=0.9.11"
sha2 = "=0.10.9"

[[bin]]
name = "codepact"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"
